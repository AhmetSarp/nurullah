<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zıpla Kaç!</title>
<style>
  :root{
    --sky-top:#7ec8ff;
    --sky-bottom:#e8f7ff;
    --panel-bg:#ffffffee;
    --accent:#ff6b6b;
    --accent2:#ffd93d;
    --dark:#2b2b3d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:var(--dark);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    touch-action:none;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #gameWrap{
    position:relative;
    width:100%;
    height:100%;
    max-width:520px;
    margin:0 auto;
    overflow:hidden;
    background:linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }
  #hud{
    position:absolute;
    top:calc(10px + env(safe-area-inset-top,0px));
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:0 14px;
    pointer-events:none;
    z-index:5;
  }
  .pill{
    background:var(--panel-bg);
    backdrop-filter: blur(4px);
    border-radius:20px;
    padding:8px 14px;
    font-weight:800;
    font-size:15px;
    color:var(--dark);
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pill .icon{font-size:16px;}
  #startScreen, #overScreen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    background:linear-gradient(180deg, rgba(126,200,255,0.95), rgba(232,247,255,0.98));
    z-index:20;
    padding:24px;
  }
  #overScreen{display:none;}
  .title{
    font-size:34px;
    font-weight:900;
    color:var(--dark);
    margin:0 0 6px 0;
    text-shadow:0 2px 0 #fff;
  }
  .subtitle{
    font-size:15px;
    color:#4a4a5e;
    margin-bottom:22px;
    max-width:280px;
    line-height:1.4;
  }
  .heroImg{
    width:150px;
    filter:drop-shadow(0 10px 12px rgba(0,0,0,0.25));
    margin-bottom:10px;
    animation:float 2.2s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-14px);}
  }
  .bigBtn{
    background:linear-gradient(180deg, #ffe066, var(--accent2));
    border:none;
    border-radius:30px;
    padding:16px 42px;
    font-size:20px;
    font-weight:900;
    color:#5c3d00;
    box-shadow:0 6px 0 #c99a00, 0 8px 14px rgba(0,0,0,0.25);
    cursor:pointer;
    transition:transform 0.08s;
  }
  .bigBtn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #c99a00, 0 4px 8px rgba(0,0,0,0.25);
  }
  .statRow{
    display:flex; gap:18px; margin:18px 0;
  }
  .statBox{
    background:#fff;
    border-radius:14px;
    padding:10px 18px;
    box-shadow:0 3px 8px rgba(0,0,0,0.12);
  }
  .statBox .num{font-size:24px; font-weight:900; color:var(--dark);}
  .statBox .lbl{font-size:11px; color:#888; font-weight:700; letter-spacing:0.5px;}
  #controlHint{
    position:absolute;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    left:0; right:0;
    text-align:center;
    color:#4a4a5e99;
    font-size:12px;
    font-weight:700;
    pointer-events:none;
    z-index:4;
    opacity:0.85;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill"><span class="icon">🪙</span><span id="scoreCoins">0</span></div>
    <div class="pill"><span class="icon">🚀</span><span id="scoreHeight">0</span> m</div>
  </div>

  <div id="controlHint">Parmağınla sağa / sola sürükle</div>

  <div id="startScreen">
    <img class="heroImg" id="heroPreview" src="" alt="karakter">
    <div class="title">Zıpla Kaç!</div>
    <div class="subtitle">Platformlara basarak yukarı zıpla, altınları topla, bombalara dokunma!</div>
    <button class="bigBtn" id="startBtn">BAŞLA</button>
  </div>

  <div id="overScreen">
    <div class="title">Oyun Bitti!</div>
    <div class="statRow">
      <div class="statBox"><div class="num" id="finalHeight">0 m</div><div class="lbl">YÜKSEKLİK</div></div>
      <div class="statBox"><div class="num" id="finalCoins">0</div><div class="lbl">ALTIN</div></div>
    </div>
    <button class="bigBtn" id="retryBtn">TEKRAR OYNA</button>
  </div>
</div>

  const finalCoinsEl = document.getElementById('finalCoins');
  const controlHint = document.getElementById('controlHint');

  let W, H, DPR;
  function resize(){
    const rect = wrap.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const playerImg = new Image();
  let imgLoaded = false;
  playerImg.onload = ()=>{ imgLoaded = true; };
  playerImg.src = SPRITE_SRC;

  // ---------- Game constants ----------
  const GRAVITY = 0.42;
  const JUMP_VELOCITY = -13.5;
  const BIG_JUMP_VELOCITY = -19;
  const MOVE_SPEED = 5.4;
  const PLATFORM_W = 68;
  const PLATFORM_H = 16;
  const PLAYER_W = 56;
  const PLAYER_H = 81;

  let state = 'start'; // start | playing | over
  let player = {x:0,y:0,vx:0,vy:0,w:PLAYER_W,h:PLAYER_H,facing:1,squash:1};
  let platforms = [], coins = [], bombs = [], particles = [];
  let camY = 0, score = 0, coinCount = 0, bestHeight = 0, frame = 0, spawnCursorY = 0, difficultyLevel = 0;

  function metersFromScore(px){
    return Math.max(0, Math.floor(px / 26));
  }

  function initGame(){
    player = {
      x: W/2 - PLAYER_W/2,
      y: H - 160,
      vx: 0,
      vy: JUMP_VELOCITY,
      w: PLAYER_W,
      h: PLAYER_H,
      facing: 1,
      squash: 1
    };
    camY = 0;
    score = 0;
    coinCount = 0;
    bestHeight = 0;
    frame = 0;
    difficultyLevel = 0;
    platforms = [];
    coins = [];
    bombs = [];
    particles = [];

    // starting platform right under player
    platforms.push({x: W/2 - PLATFORM_W/2, y: player.y + player.h + 6, w: PLATFORM_W, type:'normal', vx:0, broken:false});

    let y = player.y;
    spawnCursorY = y;
    while (spawnCursorY > -H*1.5){
      spawnCursorY -= randRange(58, 95);
      spawnPlatformRow(spawnCursorY);
    }
  }

  function randRange(a,b){ return a + Math.random()*(b-a); }

  function spawnPlatformRow(y){
    const heightScore = metersFromScore(-y + (H-160));
    const movingChance = Math.min(0.12 + heightScore*0.0025, 0.38);
    const breakChance = Math.min(0.08 + heightScore*0.002, 0.28);
    const bombChance = Math.min(0.10 + heightScore*0.003, 0.34);
    const coinChance = 0.5;

    const x = randRange(10, W - PLATFORM_W - 10);
    let type = 'normal';
    let vx = 0;
    if (Math.random() < movingChance){
      type = 'moving';
      vx = (Math.random() < 0.5 ? -1 : 1) * randRange(1.0, 2.0);
    } else if (Math.random() < breakChance){
      type = 'break';
    }

    const plat = {x, y, w: PLATFORM_W, type, vx, broken:false, wobble: Math.random()*Math.PI*2};
    platforms.push(plat);

    if (Math.random() < coinChance){
      coins.push({
        x: x + PLATFORM_W/2,
        y: y - 34,
        r: 11,
        collected:false,
        bob: Math.random()*Math.PI*2
      });
    }

    if (Math.random() < bombChance){
      // place bomb floating nearby, not exactly overlapping the platform's coin
      const bx = clamp(x + randRange(-40,40) + PLATFORM_W/2, 24, W-24);
      const by = y - randRange(50, 100);
      bombs.push({
        x: bx, y: by, r: 15,
        bob: Math.random()*Math.PI*2,
        vx: (Math.random()<0.5?-1:1) * randRange(0.4,1.1)
      });
    }
  }

  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

  // ---------- Input ----------
  let pointerActive = false;
  let pointerTargetX = null;

  function handlePointer(clientX){
    const rect = canvas.getBoundingClientRect();
    pointerTargetX = clientX - rect.left;
  }
  canvas.addEventListener('touchstart', (e)=>{
    pointerActive = true;
    handlePointer(e.touches[0].clientX);
    controlHint.style.opacity = '0';
  }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{
    handlePointer(e.touches[0].clientX);
  }, {passive:true});
  canvas.addEventListener('touchend', ()=>{ pointerActive = false; }, {passive:true});

  canvas.addEventListener('mousedown', (e)=>{
    pointerActive = true;
    handlePointer(e.clientX);
    controlHint.style.opacity = '0';
  });
  window.addEventListener('mousemove', (e)=>{
    if (pointerActive) handlePointer(e.clientX);
  });
  window.addEventListener('mouseup', ()=>{ pointerActive = false; });

  // keyboard fallback
  let keys = {};
  window.addEventListener('keydown', (e)=>{ keys[e.key]=true; });
  window.addEventListener('keyup', (e)=>{ keys[e.key]=false; });

  // ---------- Game loop ----------
  function update(){
    frame++;

    // horizontal control
    if (pointerActive && pointerTargetX !== null){
      const dx = pointerTargetX - (player.x + player.w/2);
      player.vx = clamp(dx * 0.14, -MOVE_SPEED, MOVE_SPEED);
    } else if (keys['ArrowLeft']){
      player.vx = -MOVE_SPEED;
    } else if (keys['ArrowRight']){
      player.vx = MOVE_SPEED;
    } else {
      player.vx *= 0.85;
    }

    if (player.vx > 0.3) player.facing = 1;
    else if (player.vx < -0.3) player.facing = -1;

    player.x += player.vx;
    if (player.x < -player.w*0.3) player.x = -player.w*0.3;
    if (player.x > W - player.w*0.7) player.x = W - player.w*0.7;

    player.vy += GRAVITY;
    player.y += player.vy;

    // moving platforms
    for (const p of platforms){
      if (p.type === 'moving'){
        p.x += p.vx;
        if (p.x < 6 || p.x + p.w > W-6) p.vx *= -1;
      }
    }

    // collision with platforms (only when falling)
    if (player.vy > 0){
      for (const p of platforms){
        if (p.broken) continue;
        const px1 = p.x, px2 = p.x + p.w;
        const py = p.y;
        const feetY = player.y + player.h;
        const prevFeetY = feetY - player.vy;
        if (
          player.x + player.w*0.7 > px1 &&
          player.x + player.w*0.3 < px2 &&
          prevFeetY <= py + 6 &&
          feetY >= py
        ){
          if (p.type === 'break'){
            p.broken = true;
            spawnParticles(p.x + p.w/2, p.y, '#c98a52', 10);
            player.vy = JUMP_VELOCITY;
          } else {
            player.vy = JUMP_VELOCITY;
            spawnParticles(player.x + player.w/2, player.y+player.h, '#ffffff', 6);
          }
          player.squash = 1.35;
        }
      }
    }

    // coin collision
    for (const c of coins){
      if (c.collected) continue;
      const dx = (player.x+player.w/2) - c.x;
      const dy = (player.y+player.h/2) - c.y;
      if (Math.sqrt(dx*dx+dy*dy) < c.r + 24){
        c.collected = true;
        coinCount++;
        spawnParticles(c.x, c.y, '#ffd93d', 12);
      }
    }

    // bomb collision -> game over
    for (const b of bombs){
      const dx = (player.x+player.w/2) - b.x;
      const dy = (player.y+player.h*0.5) - b.y;
      if (Math.sqrt(dx*dx+dy*dy) < b.r + 20){
        triggerGameOver();
        return;
      }
    }

    // camera follow (scroll up when player above middle)
    const followLine = H * 0.42;
    if (player.y < followLine){
      const dy = followLine - player.y;
      camShift(dy);
      player.y = followLine;
    }

    // update score by height
    const climbed = metersFromScore(camY);
    if (climbed > bestHeight) bestHeight = climbed;

    // fell off bottom -> game over
    if (player.y > H + 60){
      triggerGameOver();
      return;
    }

    // spawn new rows as needed (coordinates are screen-space since we shift all objects with the camera)
    while (spawnCursorY > -140){
      spawnCursorY -= randRange(58, 96);
      spawnPlatformRow(spawnCursorY);
    }

    // cleanup off-screen
    platforms = platforms.filter(p => p.y < H + 120 && !(p.broken && p.y < -60));
    coins = coins.filter(c => c.y < H + 200 && !c.collected);
    bombs = bombs.filter(b => b.y < H + 200);
    particles = particles.filter(pt => pt.life > 0);

    for (const pt of particles){
      pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.25; pt.life -= 1;
    }

    player.squash += (1 - player.squash) * 0.2;

    scoreCoinsEl.textContent = coinCount;
    scoreHeightEl.textContent = bestHeight;
  }

  // camera bookkeeping
  let camAccum = 0;
  function camShift(dy){
    camAccum += dy;
    camY += dy;
    player.y += 0; // handled by caller
    for (const p of platforms) p.y += dy;
    for (const c of coins) c.y += dy;
    for (const b of bombs) b.y += dy;
    for (const pt of particles) pt.y += dy;
    spawnCursorY += dy;
  }
  function spawnParticles(x,y,color,n){
    for (let i=0;i<n;i++){
      particles.push({
        x, y, color,
        vx: randRange(-3,3),
        vy: randRange(-4,-1),
        life: 24 + Math.random()*10,
        r: randRange(2,4)
      });
    }
  }

  // ---------- Bomb & coin animation ----------
  function animateEntities(){
    for (const c of coins){ c.bob += 0.08; }
    for (const b of bombs){
      b.bob += 0.06;
      b.x += b.vx;
      if (b.x < 20 || b.x > W-20) b.vx *= -1;
    }
    for (const p of platforms){ if(p.type==='normal') p.wobble += 0.02; }
  }

  // ---------- Draw ----------
  function drawBackground(){
    const grad = ctx.createLinearGradient(0,0,0,H);
    const t = clamp(bestHeight/400, 0, 1);
    const topColor = lerpColor([126,200,255],[20,20,60], t);
    const botColor = lerpColor([232,247,255],[80,60,120], t);
    grad.addColorStop(0, `rgb(${topColor.join(',')})`);
    grad.addColorStop(1, `rgb(${botColor.join(',')})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // simple cloud/star decorations using frame-based pseudo positions
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i=0;i<6;i++){
      const cx = (i*97 + (camY*0.15)) % (W+140) - 70;
      const cy = (i*133) % H;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 30, 12, 0, 0, Math.PI*2);
      ctx.fillStyle = t>0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.7)';
      ctx.fill();
    }
    ctx.restore();
  }

  function lerpColor(a,b,t){
    return [
      Math.round(a[0]+(b[0]-a[0])*t),
      Math.round(a[1]+(b[1]-a[1])*t),
      Math.round(a[2]+(b[2]-a[2])*t)
    ];
  }

  function drawPlatform(p){
    if (p.broken) return;
    ctx.save();
    const wob = p.type==='normal' ? Math.sin(p.wobble)*1.2 : 0;
    ctx.translate(p.x + p.w/2, p.y + wob);
    ctx.translate(-p.w/2, 0);
    let grad = ctx.createLinearGradient(0,0,0,PLATFORM_H);
    if (p.type === 'break'){
      grad.addColorStop(0,'#d99a6c');
      grad.addColorStop(1,'#a5643a');
    } else if (p.type === 'moving'){
      grad.addColorStop(0,'#7de08a');
      grad.addColorStop(1,'#3fae55');
    } else {
      grad.addColorStop(0,'#8fd8ff');
      grad.addColorStop(1,'#4aa8e0');
    }
    ctx.fillStyle = grad;
    roundRect(ctx, 0, 0, p.w, PLATFORM_H, 8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    roundRect(ctx, 3, 2, p.w-6, 4, 3);
    ctx.fill();
    if (p.type === 'break'){
      ctx.strokeStyle = 'rgba(90,50,20,0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(p.w*0.3, 2); ctx.lineTo(p.w*0.4, PLATFORM_H-2);
      ctx.moveTo(p.w*0.65, 1); ctx.lineTo(p.w*0.55, PLATFORM_H-3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawCoin(c){
    if (c.collected) return;
    const bob = Math.sin(c.bob)*4;
    ctx.save();
    ctx.translate(c.x, c.y+bob);
    const grad = ctx.createRadialGradient(-3,-3,2,0,0,c.r);
    grad.addColorStop(0,'#fff6c9');
    grad.addColorStop(0.5,'#ffd93d');
    grad.addColorStop(1,'#e8a900');
    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#c98600';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#c98600';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('₺', 0, 1);
    ctx.restore();
  }

  function drawBomb(b){
    const bob = Math.sin(b.bob)*5;
    ctx.save();
    ctx.translate(b.x, b.y+bob);
    // spark
    ctx.save();
    ctx.rotate(Math.sin(b.bob*2)*0.3);
    ctx.strokeStyle = '#ff8a3d';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0,-b.r-2);
    ctx.lineTo(3,-b.r-10);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(3,-b.r-12,2.5,0,Math.PI*2);
    ctx.fillStyle = '#ffd93d';
    ctx.fill();
    ctx.restore();

    const grad = ctx.createRadialGradient(-4,-4,2,0,0,b.r);
    grad.addColorStop(0,'#5a5a6e');
    grad.addColorStop(1,'#16161f');
    ctx.beginPath();
    ctx.arc(0,0,b.r,0,Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-5,-5,4,2.5,-0.6,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(){
    for (const pt of particles){
      ctx.save();
      ctx.globalAlpha = clamp(pt.life/30, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPlayer(){
    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    const sq = player.squash;
    ctx.scale(player.facing * (1/Math.sqrt(sq)), sq);
    if (imgLoaded){
      ctx.drawImage(playerImg, -player.w/2, -player.h/2, player.w, player.h);
    } else {
      ctx.fillStyle = '#4aa8e0';
      roundRect(ctx, -player.w/2, -player.h/2, player.w, player.h, 12);
      ctx.fill();
    }
    ctx.restore();
  }

  function draw(){
    drawBackground();
    for (const p of platforms) drawPlatform(p);
    for (const c of coins) drawCoin(c);
    for (const b of bombs) drawBomb(b);
    drawParticles();
    drawPlayer();
  }

  let rafId;
  function loop(){
    if (state === 'playing'){
      update();
      animateEntities();
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function triggerGameOver(){
    state = 'over';
    finalHeightEl.textContent = bestHeight + ' m';
    finalCoinsEl.textContent = coinCount;
    overScreen.style.display = 'flex';
  }

  function startGame(){
    resize();
    initGame();
    state = 'playing';
    startScreen.style.display = 'none';
    overScreen.style.display = 'none';
    scoreCoinsEl.textContent = '0';
    scoreHeightEl.textContent = '0';
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
